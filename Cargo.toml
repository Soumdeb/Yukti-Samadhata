[workspace]
resolver = "2"
members = [
    "crates/yukti-sparse",
    "crates/yukti-model",
    "crates/yukti-numerics",
    "crates/yukti-transform",
    "crates/yukti-gpu",
    "crates/yukti-lp",
    "crates/yukti-verifier",
    "crates/yukti-auth",
    "crates/yukti-runtime",
    "crates/yukti-bench",
    "crates/yukti-cli",
]
default-members = ["crates/yukti-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yukti-Samadhata Engineering Team"]
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
argon2 = "0.5"
rand = "0.8"
rayon = "1.12"
