[workspace]
resolver = "2"
members = [
    "crates/yutki-sparse",
    "crates/yutki-model",
    "crates/yutki-numerics",
    "crates/yutki-transform",
    "crates/yutki-gpu",
    "crates/yutki-lp",
    "crates/yutki-verifier",
    "crates/yutki-auth",
    "crates/yutki-runtime",
    "crates/yutki-bench",
    "crates/yutki-cli",
]
default-members = ["crates/yutki-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yutki-Samadhata Engineering Team"]
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
argon2 = "0.5"
rand = "0.8"
